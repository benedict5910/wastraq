<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wastraq — City survey map</title>
<link rel="stylesheet" href="/assets/wq.css">
<style>
  main.content { padding: 14px; }
  #citymap { height: calc(100vh - 250px); min-height: 380px; }
</style>
</head>
<body>
<script src="/assets/wq.js"></script>
<script src="/assets/wq-map.js"></script>

<div class="drawer-scrim" id="sp-scrim"></div>
<aside class="drawer" id="sp">
  <header>
    <div class="stack" style="flex:1"><h3 id="sp-title">Property</h3>
      <span class="small muted" id="sp-sub"></span></div>
    <button class="icon ghost" onclick="SP.close()">✕</button>
  </header>
  <div class="body" id="sp-body"></div>
  <footer>
    <a class="btn primary" id="sp-open" href="#">Open in field survey</a>
    <button onclick="SP.close()">Close</button>
  </footer>
</aside>

<script>
const main = WQ.shell({ title: 'City survey map', subtitle: 'Property survey status across the authority',
                        suite: 'Survey', user: 'Supervisor' });
main.innerHTML = `
  <section class="card">
    <header><h2>Filters</h2><div class="spacer"></div>
      <span class="small muted" id="count">—</span>
      <button class="sm" id="reset">Reset</button></header>
    <div class="body">
      <div class="filters">
        <label class="field grow"><span>Search</span>
          <input id="f_q" placeholder="Property ID, owner, house number…"></label>
        <label class="field"><span>Zone / ward / route area</span><select id="f_unit"></select></label>
        <label class="field"><span>Survey status</span><select id="f_status">
          <option value="">All</option><option>APPROVED</option><option>SUBMITTED</option>
          <option>CORRECTION_REQUIRED</option><option>IN_PROGRESS</option>
          <option>NOT_SURVEYED</option><option>REJECTED</option></select></label>
        <label class="field"><span>Confidence</span><select id="f_conf">
          <option value="">All</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option>
          </select></label>
        <label class="field"><span>Surveyor</span><select id="f_surv"><option value="">All</option></select></label>
        <label class="field"><span>QA</span><select id="f_qa">
          <option value="">All</option><option value="true">Has open issue</option>
          <option value="false">Clean</option></select></label>
      </div>
    </div>
  </section>

  <section class="card">
    <header><h2>Map</h2><div class="spacer"></div>
      <button class="sm" id="fitBtn">Fit to results</button>
      <button class="sm" id="bmBtn">Basemap</button></header>
    <div id="citymap"></div>
    <div class="body" style="padding:10px 16px"><div class="legend" id="legend"></div></div>
  </section>
`;

const SP = WQ.drawer('sp');
let map, FC = null;

function filters() {
  return {
    q: WQ.$('#f_q').value.trim() || null,
    admin_unit_id: WQ.$('#f_unit').value || null,
    status: WQ.$('#f_status').value || null,
    confidence: WQ.$('#f_conf').value || null,
    surveyor_id: WQ.$('#f_surv').value || null,
    has_qa: WQ.$('#f_qa').value || null,
    limit: 3000
  };
}

async function load(fit) {
  FC = await WQ.api('/survey/api/properties/geojson' + WQ.qs(filters()));
  WQ.$('#count').textContent = FC.features.length + ' properties plotted';
  map.setLayers([{
    id: 'props', type: 'point', data: FC, pickable: true,
    style: (f) => {
      const p = f.properties;
      const key = p.open_qa_issues > 0 && p.survey_status !== 'APPROVED' ? 'LOW' : p.survey_status;
      return { fill: WQ.stateColour(key), stroke: 'rgba(0,0,0,0.5)',
               radius: p.survey_status === 'NOT_SURVEYED' ? 3 : 4.5 };
    }
  }]);
  if (fit && FC.features.length) map.fitTo(FC, 50);
  const keys = ['APPROVED', 'SUBMITTED', 'CORRECTION_REQUIRED', 'IN_PROGRESS', 'NOT_SURVEYED', 'REJECTED'];
  WQ.$('#legend').innerHTML = keys.map(k => '<span><i style="background:' + WQ.stateColour(k) +
    '"></i>' + WQ.esc(WQ.state(k).label) + '</span>').join('') +
    '<span><i style="background:' + WQ.stateColour('LOW') + '"></i>Open QA issue</span>';
}

async function openProp(pid) {
  SP.open();
  WQ.$('#sp-title').textContent = pid;
  WQ.$('#sp-sub').textContent = 'loading…';
  WQ.$('#sp-body').innerHTML = '<div class="skel" style="height:150px"></div>';
  WQ.$('#sp-open').href = '/survey/field?property=' + encodeURIComponent(pid);
  try {
    const d = await WQ.api('/survey/api/properties/' + encodeURIComponent(pid) + '/survey');
    const p = d.property, s = d.survey, g = d.geometry;
    WQ.$('#sp-sub').textContent = [p.ward_name, p.zone_name, p.route_id].filter(Boolean).join(' · ');
    const acc = s && s.location_accuracy_m;
    const thr = (d.thresholds || {}).gnss_accuracy_warn_m || 10;
    WQ.$('#sp-body').innerHTML =
      '<div class="row wrap" style="gap:6px">' + WQ.chip(p.survey_status) +
        WQ.chip(p.verification_status) +
        (p.open_qa_issues ? '<span class="chip crit"><span class="dot"></span>' +
          p.open_qa_issues + ' QA issue(s)</span>' : '') + '</div>' +
      (d.photos.length ? '<div><div class="section-title" style="margin-bottom:6px">Frontage</div>' +
        '<div class="photo-frame"><img alt="frontage" src="/survey/api/photos/' +
        encodeURIComponent(d.photos[0].photo_id) + '/file" onerror="this.parentNode.innerHTML=' +
        '\'<div class=&quot;empty small&quot;>Photo file not on disk</div>\'"></div></div>' : '') +
      '<div><div class="section-title">Property</div><dl class="kv">' +
        '<dt>Owner</dt><dd>' + WQ.esc(p.owner_name || '—') + '</dd>' +
        '<dt>House no.</dt><dd>' + WQ.esc(p.house_number || '—') + '</dd>' +
        '<dt>Address</dt><dd>' + WQ.esc(p.formatted_address || '—') + '</dd>' +
        '<dt>Ward</dt><dd>' + WQ.esc(p.ward_name || '—') + '</dd>' +
        '<dt>Route</dt><dd class="mono">' + WQ.esc(p.route_id || '—') + '</dd>' +
      '</dl></div>' +
      '<div><div class="section-title">Survey</div><dl class="kv">' +
        '<dt>Status</dt><dd>' + WQ.chip(p.survey_status) + '</dd>' +
        '<dt>Surveyor</dt><dd>' + WQ.esc(p.surveyor_name || '—') + '</dd>' +
        '<dt>Confidence</dt><dd>' + (p.survey_mapping_confidence ? WQ.chip(p.survey_mapping_confidence) : '—') + '</dd>' +
        '<dt>Source class</dt><dd class="small">' + WQ.esc((s && s.source_class) || '—') + '</dd>' +
        '<dt>Submitted</dt><dd>' + (p.submitted_at ? WQ.dateOf(p.submitted_at) : '—') + '</dd>' +
        '<dt>Reviewed</dt><dd>' + (p.reviewed_at ? WQ.dateOf(p.reviewed_at) : '—') + '</dd>' +
      '</dl></div>' +
      (s && acc !== null && acc !== undefined ? '<div><div class="section-title">Device location capture</div>' +
        '<dl class="kv">' +
        '<dt>Accuracy</dt><dd class="mono ' + (acc > thr ? 'acc-bad' : acc > thr / 2 ? 'acc-warn' : 'acc-ok') +
          '">±' + acc + ' m</dd>' +
        '<dt>Source</dt><dd>' + WQ.esc(s.location_source || '—') + '</dd>' +
        '<dt>Adjusted</dt><dd>' + (s.manually_adjusted ? 'moved on the map' : 'as captured') + '</dd>' +
        '</dl></div>' : '') +
      '<div><div class="section-title">GIS structure</div><dl class="kv">' +
        '<dt>Entrance</dt><dd>' + (g.entrance ? 'mapped' : '<span class="muted">missing</span>') + '</dd>' +
        '<dt>Frontage</dt><dd>' + (g.frontage ? 'mapped' : '<span class="muted">missing</span>') + '</dd>' +
        '<dt>Service zone</dt><dd>' + (g.service_zone
          ? (g.service_zone.area_m2 || '?') + ' m²' : '<span class="muted">missing</span>') + '</dd>' +
      '</dl></div>' +
      (d.qa_issues.length ? '<div><div class="section-title">QA issues</div>' +
        d.qa_issues.map(q => '<div class="row" style="gap:8px;margin-top:6px">' + WQ.sevChip(q.severity) +
        '<span class="small">' + WQ.esc(q.issue_type.replace(/_/g, ' ').toLowerCase()) + '</span>' +
        WQ.chip(q.status) + '</div>').join('') + '</div>' : '');
  } catch (e) {
    WQ.$('#sp-body').innerHTML = '<div class="err-box">' + WQ.esc(e.message) + '</div>';
  }
}

async function boot() {
  map = WQMap.create(WQ.$('#citymap'), { center: [12.2958, 76.6394], zoom: 14 });
  map.setTooltip(f => '<b>' + WQ.esc(f.properties.property_id) + '</b> · ' +
    WQ.esc(WQ.state(f.properties.survey_status).label) +
    (f.properties.ward_name ? ' · ' + WQ.esc(f.properties.ward_name) : ''));
  map.on('click', (f) => { if (f) { map.select('props', f.id); openProp(f.properties.property_id); } });

  try {
    const [tree, users] = await Promise.all([
      WQ.api('/survey/api/admin-units/tree'),
      WQ.api('/survey/api/users' + WQ.qs({ role: 'SURVEYOR' }))
    ]);
    WQ.$('#f_unit').innerHTML = '<option value="">Whole city</option>' +
      tree.filter(t => t.depth > 1).map(t => '<option value="' + WQ.esc(t.admin_unit_id) + '">' +
        WQ.esc(t.full_path) + '</option>').join('');
    WQ.$('#f_surv').innerHTML = '<option value="">All</option>' +
      users.map(u => '<option value="' + WQ.esc(u.user_id) + '">' + WQ.esc(u.name) + '</option>').join('');
    const unit = WQ.param('unit');
    if (unit) WQ.$('#f_unit').value = unit;
    const surv = WQ.param('surveyor');
    if (surv) WQ.$('#f_surv').value = surv;
    const st = WQ.param('status');
    if (st) WQ.$('#f_status').value = st;
  } catch (e) { WQ.toast('Filters: ' + e.message, 'crit'); }

  let t = null;
  ['#f_q', '#f_unit', '#f_status', '#f_conf', '#f_surv', '#f_qa'].forEach(sel =>
    WQ.$(sel).addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => load(true), 280); }));
  WQ.$('#reset').addEventListener('click', () => {
    ['#f_q', '#f_unit', '#f_status', '#f_conf', '#f_surv', '#f_qa'].forEach(s => WQ.$(s).value = '');
    load(true);
  });
  WQ.$('#fitBtn').addEventListener('click', () => { if (FC) map.fitTo(FC, 50); });
  let bm = true;
  WQ.$('#bmBtn').addEventListener('click', () => { bm = !bm; map.setBasemap(bm); });

  await load(true);
}
boot();
document.addEventListener('wq:theme', () => load(false));
</script>
</body>
</html>
